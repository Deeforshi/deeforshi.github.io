    </filter>
  </defs>
  <polygon points="8,2 56,2 62,8 62,56 56,62 8,62 2,56 2,8" fill="#07080f" stroke="url(#cyberGrad)" stroke-width="2" />
  <polygon points="10,6 54,6 58,10 58,54 54,58 10,58 6,54 6,10" fill="#0d101d" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1" />
  <g filter="url(#neonGlow)" font-family="'Orbitron', 'JetBrains Mono', monospace" font-weight="800" font-size="24" letter-spacing="1">
    <text x="13" y="40" fill="#00f0ff">D</text>
    <text x="33" y="40" fill="#ff2a85">F</text>
  </g>
  <rect x="12" y="46" width="40" height="2" fill="url(#cyberGrad)" opacity="0.85" />
